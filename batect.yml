containers:
  wine-builder:
    build_directory: wine-builder
    volumes:
      - local: ./wine-builder/output
        container: /output

  tfsec:
    image: aquasec/trivy:latest
    volumes:
      - local: .
        container: /code
    working_directory: /code

  golang:
    image: golang:latest
    volumes:
      - local: .
        container: /code
    working_directory: /code

tasks:
  security-scan:
    description: Runs 'tfsec' security scanner
    run:
      container: tfsec
      command: config /code

  build:
    description: Builds the binaries from this Go project
    shell: true
    shell_executable: sh
    run:
      container: golang
      command: env GOOS=linux GOARCH=amd64 go build -o "yapl" -buildvcs=false "./cmd/yapl"

  build-wine:
    description: "Builds a Wine version using WoW64 single-build. Pass version as: ./go-batect build-wine -- 11.7"
    run:
      container: wine-builder
      command: "11.7"

  check-all:
    description: Runs all the code checks
    prerequisites:
      - build
      - security-scan
